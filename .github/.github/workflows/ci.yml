name: Group 71 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Backend Logic Verification
      run: node -e '
        const fs = require("fs");
        eval(fs.readFileSync("backend.js", "utf8"));
        eval(fs.readFileSync("tests/qa-runner.js", "utf8"));
        runQATests();
      '